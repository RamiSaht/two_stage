[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "two_stage"
version = "1.0.0"
description = "Component-level anomaly detection and remaining useful life prediction for offshore wind turbines"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools]
packages = ["two_stage"]
